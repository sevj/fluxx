services:
    _defaults:
        autowire: true
        autoconfigure: true

    _instanceof:
        Fluxx\Workflow\WorkflowInterface:
            tags: ['fluxx.workflow']
        Fluxx\StepType\StepTypeProviderInterface:
            tags: ['fluxx.step_type_provider']

    Fluxx\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/FluxxBundle.php'

    Fluxx\Workflow\SynchronizationRegistry:
        arguments:
            $workflows: !tagged_iterator { tag: fluxx.workflow }

    Fluxx\StepType\StepTypeRegistry:
        arguments:
            $providers: !tagged_iterator { tag: fluxx.step_type_provider }

    Fluxx\Settings\RuntimeSettingsManager:
        arguments:
            $settingRepository: '@Fluxx\Repository\FluxxSettingRepository'
            $defaultStaleLockTimeoutSeconds: '%fluxx.runtime.defaults.stale_lock_timeout_seconds%'
            $defaultWorkerHeartbeatTimeoutSeconds: '%fluxx.runtime.defaults.worker_heartbeat_timeout_seconds%'
            $defaultHealthWarningThresholdSeconds: '%fluxx.runtime.defaults.health_warning_threshold_seconds%'
            $defaultHealthCriticalThresholdSeconds: '%fluxx.runtime.defaults.health_critical_threshold_seconds%'
            $defaultMaxGlobalRetries: '%fluxx.runtime.defaults.max_global_retries%'

    Fluxx\Repository\FluxxSettingLookupInterface: '@Fluxx\Repository\FluxxSettingRepository'

    Fluxx\Workflow\FluxxEngineInterface: '@Fluxx\Workflow\FluxxEngine'

    Fluxx\Workflow\Lock\WorkflowExecutionLockManagerInterface: '@Fluxx\Workflow\Lock\WorkflowExecutionLockManager'
    Fluxx\Workflow\Payload\WorkflowPayloadStoreInterface: '@Fluxx\Workflow\Payload\WorkflowPayloadStore'
    Fluxx\Repository\WorkflowExecutionLockStoreInterface: '@Fluxx\Repository\WorkflowExecutionLockRepository'
    Fluxx\Repository\WorkflowRunLookupInterface: '@Fluxx\Repository\WorkflowRunRepository'
    Fluxx\Repository\WorkflowStepRunLookupInterface: '@Fluxx\Repository\WorkflowStepRunRepository'
    Fluxx\Repository\WorkflowPayloadLookupInterface: '@Fluxx\Repository\WorkflowPayloadRepository'
    Fluxx\Repository\RuntimeWorkerStateLookupInterface: '@Fluxx\Repository\RuntimeWorkerStateRepository'
